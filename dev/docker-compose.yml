# Lokale Testserver für die Entwicklung.
#   sudo docker compose -f dev/docker-compose.yml up -d
#
# GreenMail: SMTP/IMAP/POP3 ohne Konfiguration; Mails an @fjordpost.test
# werden lokal zugestellt. Testkonten (Benutzername = E-Mail-Adresse):
#   max@fjordpost.test / geheim
#   anna@fjordpost.test / geheim
# Radicale: CalDAV/CardDAV auf Port 5232, Konto max / geheim; Inhalte gehen beim
# Neustart des Containers verloren (Ablage unter /tmp).
# Ports: IMAP 3143 (unverschlüsselt), IMAPS 3993, POP3 3110, POP3S 3995,
#        SMTP 3025 (unverschlüsselt), SMTPS 3465
services:
  greenmail:
    image: greenmail/standalone:2.1.2
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled=false
        -Dgreenmail.users.login=email
        -Dgreenmail.users=max@fjordpost.test:geheim,anna@fjordpost.test:geheim
        -Dgreenmail.verbose
    ports:
      - "3025:3025"
      - "3110:3110"
      - "3143:3143"
      - "3465:3465"
      - "3993:3993"
      - "3995:3995"
  radicale:
    image: tomsquest/docker-radicale:3.5.1.0
    volumes:
      - ./radicale:/config:ro
    ports:
      - "5232:5232"
